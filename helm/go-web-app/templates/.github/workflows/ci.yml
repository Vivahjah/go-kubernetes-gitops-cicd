
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "helm/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o go-web-app .

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.59.0

  publish-docker-image:
    runs-on: ubuntu-latest
    needs: [build, code-quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}

  update-helm-values:
    runs-on: ubuntu-latest
    needs: publish-docker-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ADDED: GitHub Personal Access Token
          token: ${{ secrets.TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.run_id }}\"/" helm/go-web-app/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "Ugochukwu Mengwa"
          git config user.email "mengwa44@gmail.com"
          git add helm/go-web-app/values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update image tag in Helm to ${{ github.run_id }}"
            git push
          else
            echo "No changes to commit."
          fi
